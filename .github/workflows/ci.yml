name: ci

on: [push, pull_request]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Frame, IMU, filter and simulator end-to-end tests (no ROS needed)
        run: python -m pytest test -v
      - name: Parser throughput on the CI runner (informational)
        run: python tools/benchmark_parser.py --frames 20000

  colcon-build:
    runs-on: ubuntu-latest
    container: ros:jazzy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/serial_imu_bridge
      - name: Install dependencies from package.xml (also checks the rosdep keys)
        run: |
          apt-get update
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy
      - name: Build
        run: . /opt/ros/jazzy/setup.bash && colcon build --event-handlers console_direct+
      - name: Test
        run: |
          . /opt/ros/jazzy/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

  sil-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the ROS 2 image
        run: docker build -t serial_imu_bridge .
      - name: Software-in-the-loop (virtual board -> virtual serial port -> ROS 2 nodes)
        run: docker run --rm -v "$PWD/tools:/tools:ro" serial_imu_bridge bash /tools/sil_test.sh
